variant: q_base
dataset: gtea

paths:
  output_dir: runs/q_base/gtea/outputs
  log_dir: runs/q_base/gtea/logs
  temp_dir: runs/q_base/gtea/tmp
  actionformer_output_dir: runs/q_base/gtea/actionformer
  xdg_cache_home: runs/q_base/gtea/tmp/xdg_cache
  matplotlib_config_dir: runs/q_base/gtea/tmp/matplotlib
  python_pycache_prefix: runs/q_base/gtea/tmp/pycache
  repo_root: .
  opentad_root: OpenTAD
  opentad_env: /root/autodl-tmp/conda/envs/opentad
  train_pred: inputs/gtea/stage1_predictions.json
  gt_anno: inputs/gtea/ground_truth.json
  fps_json: inputs/gtea/video_metadata.json
  points_csv: inputs/gtea/point_labels.csv
  pseudo_json: runs/q_base/gtea/q_base_pseudo_labels.json
  actionformer_annotation_json: runs/q_base/gtea/actionformer_annotations/gtea_q_base.json
  actionformer_config: OpenTAD/configs/actionformer/gtea_i3d_dynamic.py

q_base:
  posterior_temperature: 0.1
  consensus_temperature: 0.1
  consensus_weight: 0.5
  conflict_mode: distance
  conflict_power: 2.0
  softmax_source: true
