variant: q_base
dataset: beoid

paths:
  output_dir: runs/q_base/beoid/outputs
  log_dir: runs/q_base/beoid/logs
  temp_dir: runs/q_base/beoid/tmp
  actionformer_output_dir: runs/q_base/beoid/actionformer
  xdg_cache_home: runs/q_base/beoid/tmp/xdg_cache
  matplotlib_config_dir: runs/q_base/beoid/tmp/matplotlib
  python_pycache_prefix: runs/q_base/beoid/tmp/pycache
  repo_root: .
  opentad_root: OpenTAD
  opentad_env: /root/autodl-tmp/conda/envs/opentad
  train_pred: inputs/beoid/stage1_predictions.json
  gt_anno: inputs/beoid/ground_truth.json
  fps_json: inputs/beoid/video_metadata.json
  points_csv: inputs/beoid/point_labels.csv
  pseudo_json: runs/q_base/beoid/q_base_pseudo_labels.json
  actionformer_annotation_json: runs/q_base/beoid/actionformer_annotations/beoid_q_base.json
  actionformer_config: OpenTAD/configs/actionformer/beoid_i3d_dynamic.py

q_base:
  posterior_temperature: 0.1
  consensus_temperature: 0.1
  consensus_weight: 0.5
  conflict_mode: distance
  conflict_power: 2.0
  softmax_source: true
